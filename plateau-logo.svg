<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Plateau Strategy Solution Lab logo">
  <defs>
    <clipPath id="pc"><circle cx="32" cy="32" r="32"/></clipPath>
    <radialGradient id="psky" cx="46%" cy="38%" r="82%">
      <stop offset="0%" stop-color="#1d3f82"/>
      <stop offset="55%" stop-color="#122a5e"/>
      <stop offset="100%" stop-color="#0a1738"/>
    </radialGradient>
    <radialGradient id="pmoon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1bd"/>
      <stop offset="45%" stop-color="#e8c15a"/>
      <stop offset="100%" stop-color="#e8c15a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pstar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1bd"/>
      <stop offset="55%" stop-color="#e8c15a"/>
      <stop offset="100%" stop-color="#e8c15a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#pc)">
    <rect width="64" height="64" fill="url(#psky)"/>

    <!-- Swirling brushstrokes, original curves in the Starry Night spirit. -->
    <g fill="none" stroke-linecap="round">
      <path d="M8 30 C 8 22, 21 20, 23 28 C 24 34, 15 35, 15 29 C 15 25, 20 25, 20 29"
            stroke="#5a7ec2" stroke-width="2.4" opacity=".9"/>
      <path d="M1 40 C 12 34, 22 42, 32 38 C 42 34, 51 41, 63 36"
            stroke="#3f63a8" stroke-width="2" opacity=".85"/>
      <path d="M3 49 C 14 45, 26 50, 36 47 C 46 44, 55 48, 64 45"
            stroke="#2f4f92" stroke-width="1.7" opacity=".8"/>
      <path d="M30 13 C 41 9, 53 12, 61 21"
            stroke="#5a7ec2" stroke-width="1.5" opacity=".8"/>
    </g>

    <!-- The moon, glowing, upper right. -->
    <circle cx="46" cy="17" r="14" fill="url(#pmoon)"/>
    <circle cx="46" cy="17" r="6.2" fill="#ffe49a"/>

    <!-- Stars, each a glow around a bright core. -->
    <circle cx="14" cy="13" r="5.2" fill="url(#pstar)"/>
    <circle cx="14" cy="13" r="1.7" fill="#fff5cf"/>
    <circle cx="53" cy="41" r="4.2" fill="url(#pstar)"/>
    <circle cx="53" cy="41" r="1.4" fill="#fff5cf"/>
    <circle cx="11" cy="27" r="3.3" fill="url(#pstar)"/>
    <circle cx="11" cy="27" r="1.1" fill="#fff5cf"/>

    <!-- The plateau: a dark flat-topped ridge, keeps the brand. -->
    <path d="M-2 66 L-2 54 C 8 52, 15 51, 22 52 L 27 48 L 45 48 L 50 52 C 56 51, 61 53, 66 54 L 66 66 Z"
          fill="#060f26"/>
  </g>
</svg>
