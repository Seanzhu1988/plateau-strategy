services:
  - type: web
    name: plateau-strategy
    runtime: python
    # Starter, not free: a free instance's filesystem is wiped on every deploy
    # and every sleep, which destroyed reservations, agent codes and guide
    # listings. A paid instance can mount a disk that survives both.
    plan: starter
    disk:
      name: plateau-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    # Custom domains are claimed when the service is created from this
    # blueprint, so they don't have to be added by hand. Render still needs
    # the matching DNS records at the registrar before it issues the
    # certificate — see DEPLOY.md Step 3.
    domains:
      - plateaustrategy.io
      - www.plateaustrategy.io
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATA_DIR
        value: /var/data         # everything the site saves lives on the disk
      - key: FLASK_SECRET
        generateValue: true      # Render makes a strong random value
      # All other secrets (Square, Twilio, etc.) are set by hand in the Render
      # dashboard under Environment — never in this file, never in git.
